<!DOCTYPE html>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav id="main-nav" class="scrolled">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">
                <img src="img/logo.svg" alt="Art2Digi Solutions" class="nav-logo-img">
                <span>Art2Digi Solutions</span>
            </a>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <ul id="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="portfolio.html" class="nav-link">Portfolio</a></li>

        </div>
    </nav>

    <div style="padding-top: var(--nav-h); min-height: 100vh; background: var(--warm-mid); display: flex; align-items: center; justify-content: center; padding-bottom: 3rem;">
        <div style="background: var(--white); border-radius: 8px; padding: 2.5rem; max-width: 560px; width: 100%; margin: 2rem 1.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center;">

            <i class="fas fa-check-circle" style="font-size: 2.5rem; color: var(--blue); margin-bottom: 1rem; display: block;"></i>

            <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--purple); margin-bottom: 0.5rem;">Message Sent!</h1>

            <p style="font-size: 0.92rem; color: var(--text); margin-bottom: 2rem; line-height: 1.6;">

            </p>

            <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.8rem 1.75rem; border-radius: 4px; background: var(--blue); color: var(--white); text-decoration: none; font-family: var(--font-body); font-weight: 600; font-size: 0.92rem;">

    <footer>

            </div>
        </div>
        <div class="footer-bottom"><p>© 2026 Art2Digi Solutions. All rights reserved.</p></div>
    </footer>

    <script>
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');
    hamburger.addEventListener('click', () => { hamburger.classList.toggle('open'); navMenu.classList.toggle('nav-open'); });
    navMenu.querySelectorAll('a').forEach(l => l.addEventListener('click', () => { hamburger.classList.remove('open'); navMenu.classList.remove('nav-open'); }));
    </script>
</body>
</html>
